name: Check website
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 scripts/check.py
      - run: python3 scripts/build.py
      - run: python3 scripts/check.py --directory dist
      - name: Build and validate the preview paths
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          python3 scripts/build.py --base-path "/$REPOSITORY_NAME/"
          python3 scripts/check.py --directory dist --base-path "/$REPOSITORY_NAME/"
